

# -----------------------
# Database
# -----------------------
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# Cấu hình Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}


# Đăng ký với Eureka Server
eureka.client.register-with-eureka=true


# Lấy danh sách các service từ Eureka Server
eureka.client.fetch-registry=true

# Dùng IP thay vì hostname container (tránh lỗi resolve hostname trong Docker network)
eureka.instance.prefer-ip-address=true
