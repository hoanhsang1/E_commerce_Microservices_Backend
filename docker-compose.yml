version: '3.8'

networks:
  microservice-net:
    driver: bridge

volumes:
  es-data:
  rabbitmq-data:

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [microservice-net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports: ["9200:9200"]
    networks: [microservice-net]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    ports: ["5601:5601"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on: [elasticsearch]
    networks: [microservice-net]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    ports: ["5044:5044"]
    environment:
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./ELKStack/logstash-data:/usr/share/logstash/data
      - ./ELKStack/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./ELKStack/mysql-connector-java-8.0.26.jar:/usr/share/logstash/logstash-core/lib/mysql-connector-java-8.0.26.jar
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    depends_on:
      elasticsearch: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [microservice-net]

  eureka-server:
    build: ./EurekaServer
    container_name: eureka-server
    environment:
      LOGSTASH_HOST: logstash
    ports: ["8761:8761"]
    networks: [microservice-net]

  config-server:
    build: ./ConfigServer
    container_name: config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      LOGSTASH_HOST: logstash
    ports: ["8763:8763"]
    depends_on: [eureka-server]
    networks: [microservice-net]

  auth-service:
    build: ./AuthService
    container_name: auth-service
    restart: on-failure
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8763
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/user_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET}
      LOGSTASH_HOST: logstash
    ports: ["8764:8764"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server: { condition: service_started }
      rabbitmq: { condition: service_started }
    networks: [microservice-net]

  user-service:
    build: ./UserService
    container_name: user-service
    restart: on-failure
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8763
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/user_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      LOGSTASH_HOST: logstash
    ports: ["8081:8081"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server: { condition: service_started }
    networks: [microservice-net]

  product-service:
    build: ./ProductService
    container_name: product-service
    restart: on-failure
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8763
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/product_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOGSTASH_HOST: logstash
    ports: ["8082:8082"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server: { condition: service_started }
    networks: [microservice-net]

  order-service:
    build: ./OrderService
    container_name: order-service
    restart: on-failure
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8763
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/order_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOGSTASH_HOST: logstash
    ports: ["8084:8084"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server: { condition: service_started }
      product-service: { condition: service_started }
    networks: [microservice-net]

  payment-service:
    build: ./PaymentService
    container_name: payment-service
    restart: on-failure
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8763
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/payment_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOGSTASH_HOST: logstash
    ports: ["8083:8083"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server: { condition: service_started }
      order-service: { condition: service_started }
    networks: [microservice-net]

  notify-service:
    build: ./NotifyService
    container_name: notify-service
    restart: on-failure
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      LOGSTASH_HOST: logstash
    ports: ["8085:8085"]
    depends_on:
      rabbitmq: { condition: service_started }
    networks: [microservice-net]

  api-gateway:
    build: ./APIGateway
    container_name: api-gateway
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOGSTASH_HOST: logstash
    ports: ["8762:8762"]
    depends_on:
      eureka-server: { condition: service_started }
      auth-service: { condition: service_started }
      user-service: { condition: service_started }
      product-service: { condition: service_started }
      order-service: { condition: service_started }
      payment-service: { condition: service_started }
    networks: [microservice-net]