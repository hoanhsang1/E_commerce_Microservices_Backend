spring.application.name=APIGateway

# Port
server.port=8762

# Key bí mật dùng để xác thực request nội bộ giữa các service
# Phải khớp với giá trị internal.api.key trong tất cả các service con
# Production: set biến môi trường INTERNAL_API_KEY thay vì hardcode ở đây
internal.api.key=${INTERNAL_API_KEY:changeme-internal-key}
