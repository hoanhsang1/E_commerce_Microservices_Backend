spring:
  cloud:
    gateway:
      routes:
        - id: users-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
        - id: products-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/v1/products/**
        - id: payments-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/v1/payments/**
        - id: orders-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/v1/orders/**
        - id: auth-service
          uri: http://auth-service:8764
          predicates:
            - Path=/api/v1/auth/**, /oauth2/**, /login/oauth2/**