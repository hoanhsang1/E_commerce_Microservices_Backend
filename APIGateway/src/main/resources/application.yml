spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            routes:
                - id: users-service
                  uri: http://localhost:8081
                  predicates:
                    - Path=/api/v1/users/**


                - id: products-service
                  uri: http://localhost:8082
                  predicates:
                    - Path=/api/v1/products/**

                - id: payments-service
                  uri: http://localhost:8083
                  predicates:
                    - Path=/api/v1/payments/**

                - id: orders-service
                  uri: http://localhost:8084
                  predicates:
                    - Path=/api/v1/orders/**

                - id: auth-service
                  uri: http://localhost:8764
                  predicates:
                    - Path=/api/v1/auth/**, /oauth2/**, /login/oauth2/**
